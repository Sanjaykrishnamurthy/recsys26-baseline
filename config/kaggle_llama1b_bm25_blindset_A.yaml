# Kaggle GPU — Llama 3.2 1B + BM25 — Blind Set A
#
# Prerequisites in your Kaggle notebook:
#   1. Add Model: Meta → Llama 3.2 → Transformers → 1B Instruct
#      (mounted at /kaggle/input/llama-3.2/transformers/1b-instruct/1)
#   2. Add Dataset: your uploaded TalkPlay parquet datasets
#      (or set HF_TOKEN secret and use Hub IDs below)
#   3. Enable GPU accelerator (T4 x2 or P100)

lm_type: "/kaggle/input/llama-3.2/transformers/1b-instruct/1"
retrieval_type: "bm25"
test_dataset_name: "talkpl-ai/TalkPlayData-Challenge-Blind-A"
item_db_name: "talkpl-ai/TalkPlayData-Challenge-Track-Metadata"
user_db_name: "talkpl-ai/TalkPlayData-Challenge-User-Metadata"
track_split_types:
  - "all_tracks"
user_split_types:
  - "all_users"
corpus_types:
  - "track_name"
  - "artist_name"
  - "album_name"
  - "release_date"
  - "tag_list"
cache_dir: "./cache"
device: "cuda"
attn_implementation: "eager"
use_user_reranker: false
