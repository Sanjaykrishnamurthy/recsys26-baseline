# Kaggle GPU — Llama 3.2 1B + BM25 — Blind Set A
#
# Prerequisites in your Kaggle notebook:
#   1. Add Model: Meta → Llama 3.2 → Transformers → 1B Instruct
#   2. Add Dataset: TalkPlayData_New (your uploaded parquet data)
#   3. Enable GPU accelerator (T4 x2 or P100)
#   4. Internet: On (for pip install)

lm_type: "/kaggle/input/llama-3.2/transformers/1b-instruct/1"
retrieval_type: "bm25"
test_dataset_name: "/kaggle/input/talkplaydata-new/data/raw/TalkPlayData-Challenge-Blind-A"
item_db_name: "/kaggle/input/talkplaydata-new/data/raw/TalkPlayData-Challenge-Track-Metadata"
user_db_name: "/kaggle/input/talkplaydata-new/data/raw/TalkPlayData-Challenge-User-Metadata"
track_split_types:
  - "all_tracks"
user_split_types:
  - "all_users"
corpus_types:
  - "track_name"
  - "artist_name"
  - "album_name"
  - "release_date"
  - "tag_list"
cache_dir: "./cache"
device: "cuda"
attn_implementation: "eager"
use_user_reranker: false
